<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Job Board MCP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #000;
      --bg-elevated: #0a0a0a;
      --border: #1a1a1a;
      --border-hover: #2a2a2a;
      --text: #ededed;
      --text-secondary: #a1a1a1;
      --text-tertiary: #666;
      --accent: #fff;
    }

    body {
      font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      letter-spacing: -0.01em;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 24px 40px;
    }

    /* Header */
    header {
      margin-bottom: 60px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 40px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .logo-mark {
      width: 32px;
      height: 32px;
      background: var(--accent);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--bg);
      font-weight: 700;
      font-size: 18px;
    }

    .logo-text {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    h1 {
      font-size: 48px;
      font-weight: 700;
      letter-spacing: -0.04em;
      margin-bottom: 16px;
      line-height: 1.05;
    }

    .subtitle {
      font-size: 18px;
      color: var(--text-secondary);
      max-width: 640px;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .stats {
      display: flex;
      gap: 32px;
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      color: var(--text-tertiary);
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .stat-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    /* Search Form */
    .search-form {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 32px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 100px auto;
      gap: 12px;
      align-items: end;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
      font-family: 'Geist Mono', monospace;
      text-transform: lowercase;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.15s;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--text-tertiary);
    }

    input::placeholder {
      color: var(--text-tertiary);
    }

    button {
      padding: 12px 24px;
      background: var(--accent);
      color: var(--bg);
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Loader */
    .loader {
      display: none;
      padding: 60px 20px;
      text-align: center;
    }

    .loader.active {
      display: block;
    }

    .spinner {
      display: inline-block;
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-radius: 50%;
      border-top-color: var(--text);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loader p {
      margin-top: 16px;
      color: var(--text-tertiary);
      font-size: 13px;
      font-family: 'Geist Mono', monospace;
    }

    /* Results */
    .results-header {
      padding: 16px 20px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      font-family: 'Geist Mono', monospace;
      font-size: 13px;
      color: var(--text-secondary);
    }

    .results-header strong {
      color: var(--text);
      font-weight: 600;
    }

    .job-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px 24px;
      margin-bottom: 12px;
      transition: border-color 0.15s;
    }

    .job-card:hover {
      border-color: var(--border-hover);
    }

    .job-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
      gap: 16px;
    }

    .job-info {
      flex: 1;
      min-width: 0;
    }

    .job-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      letter-spacing: -0.01em;
    }

    .job-company {
      font-size: 14px;
      color: var(--text-secondary);
    }

    .job-meta {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 13px;
      color: var(--text-tertiary);
      font-family: 'Geist Mono', monospace;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .source-tag {
      display: inline-block;
      padding: 3px 8px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      text-transform: lowercase;
      font-family: 'Geist Mono', monospace;
    }

    .source-lever { color: #f97316; border-color: #431a03; }
    .source-greenhouse { color: #10b981; border-color: #052e20; }
    .source-remoteok { color: #3b82f6; border-color: #0a1a3a; }

    .apply-btn {
      display: inline-block;
      padding: 8px 16px;
      background: transparent;
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.15s;
      font-family: inherit;
    }

    .apply-btn:hover {
      background: var(--text);
      color: var(--bg);
    }

    .error {
      padding: 24px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-secondary);
      text-align: center;
      font-size: 14px;
    }

    /* Footer */
    footer {
      margin-top: 80px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-tertiary);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Geist Mono', monospace;
    }

    footer a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.15s;
    }

    footer a:hover {
      color: var(--text);
    }

    .footer-links {
      display: flex;
      gap: 24px;
    }

    @media (max-width: 768px) {
      .form-grid {
        grid-template-columns: 1fr;
      }
      h1 {
        font-size: 32px;
      }
      .container {
        padding: 40px 20px 20px;
      }
      footer {
        flex-direction: column;
        gap: 16px;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-mark">J</div>
        <div class="logo-text">job-board-mcp</div>
      </div>
      <h1>Search jobs.<br>Across every platform.</h1>
      <p class="subtitle">A unified search across Lever, Greenhouse, and RemoteOK. Real listings from real companies, all in one place.</p>
      <div class="stats">
        <div class="stat"><span class="stat-dot"></span>3 sources connected</div>
        <div class="stat">1000+ jobs indexed</div>
        <div class="stat">real-time results</div>
      </div>
    </header>

    <div class="search-form">
      <div class="form-grid">
        <div class="form-group">
          <label for="query">query</label>
          <input type="text" id="query" placeholder="cloud engineer, devops, etc." value="Engineer">
        </div>
        <div class="form-group">
          <label for="location">location</label>
          <input type="text" id="location" placeholder="remote, london, etc." value="Remote">
        </div>
        <div class="form-group">
          <label for="limit">limit</label>
          <select id="limit">
            <option value="5">5</option>
            <option value="10" selected>10</option>
            <option value="20">20</option>
            <option value="30">30</option>
          </select>
        </div>
        <button id="searchBtn" onclick="searchJobs()">Search →</button>
      </div>
    </div>

    <div id="loader" class="loader">
      <div class="spinner"></div>
      <p>fetching jobs...</p>
    </div>

    <div id="results"></div>

    <footer>
      <div>© 2026 job-board-mcp</div>
      <div class="footer-links">
        <a href="https://github.com/Danialesss/job-board-mcp" target="_blank">GitHub</a>
        <a href="/api" target="_blank">API</a>
        <a href="https://github.com/Danialesss" target="_blank">@danialesss</a>
      </div>
    </footer>
  </div>

  <script>
    const API_BASE = window.location.origin;

    async function searchJobs() {
      const query = document.getElementById('query').value.trim();
      const location = document.getElementById('location').value.trim() || 'Remote';
      const limit = document.getElementById('limit').value;
      const btn = document.getElementById('searchBtn');
      const loader = document.getElementById('loader');
      const results = document.getElementById('results');

      if (!query) {
        alert('Please enter a query');
        return;
      }

      btn.disabled = true;
      loader.classList.add('active');
      results.innerHTML = '';

      try {
        const response = await fetch(`${API_BASE}/api/search?query=${encodeURIComponent(query)}&location=${encodeURIComponent(location)}&limit=${limit}`);
        const data = await response.json();

        if (!data.success) {
          throw new Error(data.error || 'Search failed');
        }

        renderResults(data.data);
      } catch (error) {
        results.innerHTML = `<div class="error">${error.message}</div>`;
      } finally {
        btn.disabled = false;
        loader.classList.remove('active');
      }
    }

    function renderResults(dataText) {
      const results = document.getElementById('results');
      
      const lines = dataText.split('\n');
      const headerMatch = lines[0].match(/Found (\d+) job listings.*\((.*)\)/);
      
      let html = '';
      if (headerMatch) {
        html += `<div class="results-header"><strong>${headerMatch[1]} results</strong> · ${headerMatch[2]}</div>`;
      }

      const jobs = dataText.split('• **').slice(1);
      
      jobs.forEach(jobText => {
        const titleMatch = jobText.match(/^(.+?)\*\* at (.+?)\n/);
        const locationMatch = jobText.match(/📍 (.+?)\n/);
        const sourceMatch = jobText.match(/💼 Source: (\w+)/);
        const urlMatch = jobText.match(/🔗 (https?:\/\/[^\n]+)/);
        
        if (titleMatch) {
          const title = titleMatch[1];
          const company = titleMatch[2];
          const location = locationMatch ? locationMatch[1] : 'Not specified';
          const source = sourceMatch ? sourceMatch[1] : 'unknown';
          const url = urlMatch ? urlMatch[1] : '#';

          html += `
            <div class="job-card">
              <div class="job-header">
                <div class="job-info">
                  <div class="job-title">${escapeHtml(title)}</div>
                  <div class="job-company">${escapeHtml(company)}</div>
                </div>
              </div>
              <div class="job-meta">
                <span>${escapeHtml(location)}</span>
                <span class="source-tag source-${source}">${source}</span>
              </div>
              <a href="${escapeHtml(url)}" target="_blank" class="apply-btn">View Position →</a>
            </div>
          `;
        }
      });

      results.innerHTML = html || '<div class="error">No jobs found. Try a different search.</div>';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    document.getElementById('query').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchJobs();
    });
    document.getElementById('location').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchJobs();
    });

    window.addEventListener('load', () => setTimeout(searchJobs, 500));
  </script>
</body>
</html>
